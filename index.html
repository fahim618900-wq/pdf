<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফেস অ্যাটেনডেন্স সিস্টেম</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .video-container { width: 640px; height: 480px; border: 2px solid #007bff; }
        .capture-btn { margin: 10px; }
        .student-list { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <!-- Navigation -->
        <ul class="nav nav-tabs" id="myTab">
            <li class="nav-item"><a class="nav-link active" href="#register">ছাত্র রেজিস্ট্রেশন</a></li>
            <li class="nav-item"><a class="nav-link" href="#attendance">হাজিরা নিন</a></li>
            <li class="nav-item"><a class="nav-link" href="#reports">রিপোর্ট</a></li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content mt-3">
            
            <!-- 1. Registration Tab -->
            <div class="tab-pane active" id="register">
                <h3>🎓 নতুন ছাত্র রেজিস্ট্রেশন</h3>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label>ছাত্রের নাম</label>
                            <input type="text" id="studentName" class="form-control" placeholder="নাম লিখুন">
                        </div>
                        <div class="mb-3">
                            <label>ক্লাস</label>
                            <select id="studentClass" class="form-select">
                                <option>৬ষ্ঠ</option><option>৭ম</option><option>৮ম</option>
                                <option>৯ম</option><option>১০ম</option>
                            </select>
                        </div>
                        <button id="startCamera" class="btn btn-primary">📷 ক্যামেরা চালু করুন</button>
                    </div>
                    <div class="col-md-6">
                        <video id="video" class="video-container" autoplay></video>
                        <div>
                            <button id="capture" class="btn btn-success capture-btn">ছবি নিন (৫টি নিন)</button>
                            <button id="registerStudent" class="btn btn-warning">রেজিস্টার করুন</button>
                        </div>
                        <div id="capturedPhotos" class="mt-3"></div>
                    </div>
                </div>
                <div class="mt-4">
                    <h5>রেজিস্টার্ড ছাত্ররা:</h5>
                    <div id="registeredStudents" class="student-list"></div>
                </div>
            </div>

            <!-- 2. Attendance Tab -->
            <div class="tab-pane" id="attendance">
                <h3>✅ হাজিরা নিন</h3>
                <div class="row">
                    <div class="col-md-6">
                        <video id="attendanceVideo" class="video-container" autoplay></video>
                        <button id="startAttendance" class="btn btn-primary mt-2">হাজিরা শুরু করুন</button>
                        <button id="stopAttendance" class="btn btn-danger mt-2">বন্ধ করুন</button>
                    </div>
                    <div class="col-md-6">
                        <h5>আজকের হাজিরা:</h5>
                        <div id="todayAttendance" class="student-list"></div>
                        <div class="mt-3">
                            <button id="exportCSV" class="btn btn-secondary">CSV ডাউনলোড</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. Reports Tab -->
            <div class="tab-pane" id="reports">
                <h3>📊 রিপোর্ট</h3>
                <div class="mb-3">
                    <label>তারিখ নির্বাচন করুন:</label>
                    <input type="date" id="reportDate" class="form-control">
                </div>
                <div id="attendanceReport"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
